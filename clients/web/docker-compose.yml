services:
  ui:
    image: node:22-alpine
    working_dir: /app/web/ui
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - ../web:/app/web
      - ../core:/app/core
      # - ui_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true

volumes:
  ui_node_modules: