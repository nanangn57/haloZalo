openapi: 3.0.3
info:
  title: haloZalo API
  version: 0.1.0
  description: |
    Hợp đồng HTTP public của app. Client gọi một URL.
    Quyết định nằm ở doc/contract/decisions.md.
    Bản này có đăng ký kèm xác minh email, đăng nhập, kiểm tra token, tìm user, nhóm,
    hội thoại, tin TEXT hoặc EMOTION, lịch sử, đã đọc, reaction, và thống kê đã gom.
    Kiểm tra session nằm trong process. File này không có API nội bộ giữa các module.
servers:
  - url: https://api.example.com
    description: URL cloud của tuần hiện tại. P4 thay khi có URL thật.
tags:
  - name: Auth
  - name: Users
  - name: Groups
  - name: Messages
  - name: Stats
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Gửi link xác minh để đăng ký
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Đã gửi link xác minh. Tài khoản chưa được tạo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAccepted"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Username hoặc email đã có tài khoản, hoặc còn bản chờ chưa hết hạn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: CONFLICT
                  message: Username or email already exists
  /auth/verify:
    get:
      tags: [Auth]
      operationId: verifyEmail
      summary: Xác minh email và tạo tài khoản
      description: Link trong email trỏ tới đây. Token hết hạn sau 2 phút kể từ lúc đăng ký.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Đã tạo tài khoản. Chưa cấp token đăng nhập.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Link hết hạn hoặc không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Verification link is invalid or expired
        "409":
          description: Username hoặc email đã tồn tại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: CONFLICT
                  message: Username or email already exists
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập và cấp token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Sai username, email, hoặc password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Invalid login or password
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Kiểm tra token và trả user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /users:
    get:
      tags: [Users]
      operationId: findUser
      summary: Tìm user theo username hoặc email để mở chat 1-1
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Username, hoặc email nếu chuỗi có ký tự @.
          schema:
            type: string
            minLength: 1
            maxLength: 254
      responses:
        "200":
          description: Đúng một user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Không có user với username hoặc email này.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: User not found
  /groups:
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Tạo nhóm, người tạo là owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Đã tạo nhóm và ghi người tạo là owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [Groups]
      operationId: listGroups
      summary: Xem danh sách nhóm của user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Các nhóm user đang là thành viên, kể cả nhóm user làm owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /groups/{groupId}/members:
    post:
      tags: [Groups]
      operationId: addGroupMember
      summary: Owner thêm thành viên
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Đã thêm thành viên với role MEMBER.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User đã là thành viên.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: CONFLICT
                  message: User is already a member
  /groups/{groupId}/members/{userId}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Owner xoá thành viên, hoặc thành viên tự rời
      description: |
        Owner xoá user khác. Thành viên tự rời khi userId là chính mình.
        Owner không tự rời và không bị xoá.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberUserId"
      responses:
        "204":
          description: Đã xoá membership.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/direct:
    post:
      tags: [Messages]
      operationId: openDirectConversation
      summary: Mở hội thoại 1-1 với một user
      description: |
        Một cặp user một hội thoại DIRECT. 201 khi tạo, 200 khi đã có.
        Gọi với chính mình thì 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenDirectRequest"
      responses:
        "201":
          description: Đã tạo hội thoại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "200":
          description: Hội thoại của cặp này đã có.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /conversations:
    get:
      tags: [Messages]
      operationId: listConversations
      summary: Danh sách hội thoại của user hiện tại
      description: Hoạt động gần nhất trước. `limit` mặc định 50, tối đa 100.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Một trang hội thoại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /conversations/{conversationId}:
    get:
      tags: [Messages]
      operationId: getConversation
      summary: Xem một hội thoại
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Hội thoại user đang thuộc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
  /conversations/{conversationId}/messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Gửi một tin TEXT hoặc EMOTION vào hội thoại đã mở
      description: |
        Hội thoại phải được mở trước. Chat 1-1 mở bằng `POST /conversations/direct`.
        Hội thoại nhóm dùng `groupId` làm `conversationId`.
        Ghi tin trước khi phát event `messaging.message.created`.
        Cùng sender và cùng clientMsgId trả lại tin cũ, không tăng seq.
        Người gửi không thuộc hội thoại thì 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Tin mới đã ghi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "200":
          description: clientMsgId đã tồn tại. Trả tin đã ghi, seq không đổi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Lịch sử hoặc catch-up tin trong hội thoại
      description: |
        Không có `afterSeq`: trang mới nhất, `beforeSeq` để xem cũ hơn.
        Có `afterSeq`: tin sau mốc đó. Cả hai cùng lúc thì 400.
        Luôn theo `seq` tăng dần. `limit` mặc định 100, tối đa 200.
        Tin đã xoá có `status` là `DELETED` và không có `body`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: afterSeq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: beforeSeq
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Một trang tin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
  /conversations/{conversationId}/read:
    put:
      tags: [Messages]
      operationId: markConversationRead
      summary: Đánh dấu đã đọc tới một seq
      description: |
        Mốc chỉ tiến. `seq` quá tin mới nhất thì lấy tin mới nhất.
        Phát `messaging.read.updated` tới thiết bị của chính user đó khi mốc đổi.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Mốc đã đọc của người gọi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadState"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
  /conversations/{conversationId}/forwards:
    post:
      tags: [Messages]
      operationId: forwardMessage
      summary: Chuyển tiếp một tin vào hội thoại
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Tin chuyển tiếp đã ghi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "200":
          description: clientMsgId đã tồn tại. Trả tin đã ghi, seq không đổi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{conversationId}/messages/{messageId}:
    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Xoá một tin của chính người gửi
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Đã xoá. Phát `messaging.message.deleted`.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Không thuộc hội thoại, hoặc không phải người gửi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FORBIDDEN
                  message: Not a member of this conversation
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{conversationId}/messages/{messageId}/reactions/{code}:
    put:
      tags: [Messages]
      operationId: addReaction
      summary: Gắn reaction lên một tin
      description: Gọi lại cùng user và cùng code không đổi gì. Phát `messaging.reaction.added` khi thêm mới.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/ReactionCode"
      responses:
        "204":
          description: Đã gắn reaction.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Messages]
      operationId: removeReaction
      summary: Gỡ reaction của chính mình
      description: Phát `messaging.reaction.removed` khi có reaction để gỡ.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/ReactionCode"
      responses:
        "204":
          description: Đã gỡ reaction.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{conversationId}/messages/{messageId}/reactions:
    get:
      tags: [Messages]
      operationId: listReactions
      summary: Danh sách reaction của một tin
      description: Một dòng cho mỗi user và code, cũ nhất trước.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Các reaction đang gắn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotMember"
        "404":
          $ref: "#/components/responses/NotFound"
  /stats:
    get:
      tags: [Stats]
      operationId: activityStats
      summary: Số lần đăng nhập, tạo nhóm và tin mới
      description: Đọc bảng tổng hợp trong schema `analytics`. Không quét schema `messaging`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tổng đã gom.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityStats"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /ws:
    get:
      tags: [Messages]
      operationId: connectRealtime
      summary: Mở WebSocket nhận tin mới
      description: |
        Nâng cấp lên WebSocket. Session id truyền query `access_token` vì trình duyệt không gắn header Authorization cho WebSocket.
        Thiếu session, session không tồn tại, hoặc session hết hạn thì đóng kết nối, không nâng cấp.
        Mỗi frame là envelope trong doc/contract/events.md.
        Bản này đẩy `messaging.message.created`, `messaging.message.deleted`, `messaging.reaction.added`, `messaging.reaction.removed`, và `messaging.read.updated`.
        `messaging.read.updated` chỉ tới thiết bị của user đã đọc.
      parameters:
        - name: access_token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Đã nâng cấp sang WebSocket.
        "401":
          $ref: "#/components/responses/Unauthenticated"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Session id do Identity cấp trong accessToken. Không phải JWT.
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReactionCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        enum: [like, love, haha, wow, sad, angry]
  responses:
    Unauthenticated:
      description: Thiếu session, session không tồn tại, hoặc session hết hạn.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Missing or invalid access token
    ValidationError:
      description: Body không đúng hợp đồng.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Text body exceeds 4096 bytes
    Forbidden:
      description: User không có quyền với nhóm này.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Not allowed to change this group
    NotMember:
      description: User không thuộc hội thoại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Not a member of this conversation
    NotFound:
      description: Nhóm hoặc user không tồn tại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Group not found
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    RegisterAccepted:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Username hoặc email.
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Session id opaque do Identity cấp. Client gửi lại nguyên chuỗi. Không phải JWT.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Số giây đến khi access token hết hạn. Bản này là 3 ngày.
          example: 259200
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required: [userId, username, email]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    Group:
      type: object
      additionalProperties: false
      required: [groupId, name, ownerId, role]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        role:
          type: string
          description: Role của user hiện tại trong nhóm.
          enum: [OWNER, MEMBER]
    GroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    Membership:
      type: object
      additionalProperties: false
      required: [groupId, userId, role]
      properties:
        groupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [MEMBER]
    SendMessageRequest:
      oneOf:
        - $ref: "#/components/schemas/SendTextRequest"
        - $ref: "#/components/schemas/SendEmotionRequest"
      discriminator:
        propertyName: type
        mapping:
          TEXT: "#/components/schemas/SendTextRequest"
          EMOTION: "#/components/schemas/SendEmotionRequest"
    SendTextRequest:
      type: object
      additionalProperties: false
      required: [type, body, clientMsgId]
      properties:
        type:
          type: string
          enum: [TEXT]
        body:
          type: string
          minLength: 1
          description: Server từ chối khi UTF-8 dài hơn 4096 byte.
        clientMsgId:
          type: string
          format: uuid
        replyTo:
          type: string
          format: uuid
          description: Tin được trả lời, cùng hội thoại. Không bắt buộc.
    SendEmotionRequest:
      type: object
      additionalProperties: false
      required: [type, body, clientMsgId]
      properties:
        type:
          type: string
          enum: [EMOTION]
        body:
          type: string
          description: Mã icon trong bộ đã chốt.
          enum: [like, love, haha, wow, sad, angry]
        clientMsgId:
          type: string
          format: uuid
        replyTo:
          type: string
          format: uuid
          description: Tin được trả lời, cùng hội thoại. Không bắt buộc.
    OpenDirectRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: User còn lại của hội thoại 1-1.
    ForwardMessageRequest:
      type: object
      additionalProperties: false
      required: [messageId, clientMsgId]
      properties:
        messageId:
          type: string
          format: uuid
        clientMsgId:
          type: string
          format: uuid
    MarkReadRequest:
      type: object
      additionalProperties: false
      required: [seq]
      properties:
        seq:
          type: integer
          minimum: 0
    ReadState:
      type: object
      additionalProperties: false
      required: [conversationId, lastReadSeq, unreadCount]
      properties:
        conversationId:
          type: string
          format: uuid
        lastReadSeq:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
    Conversation:
      type: object
      additionalProperties: false
      required: [conversationId, type, memberIds, lastSeq, createdAt]
      properties:
        conversationId:
          type: string
          format: uuid
        type:
          type: string
          enum: [DIRECT, GROUP]
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        lastSeq:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
        lastMessage:
          $ref: "#/components/schemas/Message"
        lastReadSeq:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
    ConversationList:
      type: object
      additionalProperties: false
      required: [conversations, nextCursor]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        nextCursor:
          type: string
          nullable: true
          description: Null ở trang cuối. Gửi lại làm query `cursor`.
    MessagePage:
      type: object
      additionalProperties: false
      required: [messages, hasMore]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        hasMore:
          type: boolean
    ReactionList:
      type: object
      additionalProperties: false
      required: [reactions]
      properties:
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
    Reaction:
      type: object
      additionalProperties: false
      required: [userId, code, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        code:
          type: string
          enum: [like, love, haha, wow, sad, angry]
        createdAt:
          type: string
          format: date-time
    ActivityStats:
      type: object
      additionalProperties: false
      required: [logins, groupsCreated, messagesCreated]
      properties:
        logins:
          type: integer
          minimum: 0
        groupsCreated:
          type: integer
          minimum: 0
        messagesCreated:
          type: integer
          minimum: 0
    Message:
      oneOf:
        - $ref: "#/components/schemas/TextMessage"
        - $ref: "#/components/schemas/EmotionMessage"
      discriminator:
        propertyName: type
        mapping:
          TEXT: "#/components/schemas/TextMessage"
          EMOTION: "#/components/schemas/EmotionMessage"
    TextMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [TEXT]
            body:
              type: string
              description: Vắng khi status là DELETED.
    EmotionMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [EMOTION]
            body:
              type: string
              enum: [like, love, haha, wow, sad, angry]
              description: Vắng khi status là DELETED.
    MessageBase:
      type: object
      required: [messageId, conversationId, seq, senderId, clientMsgId, createdAt]
      properties:
        messageId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        senderId:
          type: string
          format: uuid
        clientMsgId:
          type: string
          format: uuid
        replyTo:
          type: string
          format: uuid
        forwardedFrom:
          type: string
          format: uuid
        status:
          type: string
          enum: [DELETED]
          description: Có mặt khi tin đã xoá. Tin thường không có field này.
        deletedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT]
            message:
              type: string
