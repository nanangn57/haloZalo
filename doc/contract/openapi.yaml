openapi: 3.0.3
info:
  title: haloZalo API
  version: 0.1.0
  description: |
    Hợp đồng HTTP public của app. Client gọi một URL.
    Quyết định nằm ở doc/contract/decisions.md.
    Bản này có đăng ký, đăng nhập, kiểm tra token, nhóm, và gửi một tin TEXT hoặc EMOTION.
    Kiểm tra session nằm trong process. File này không có API nội bộ giữa các module.
servers:
  - url: https://api.example.com
    description: URL cloud của tuần hiện tại. P4 thay khi có URL thật.
tags:
  - name: Auth
  - name: Groups
  - name: Messages
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Đăng ký tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Đã tạo tài khoản và cấp token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Username hoặc email đã tồn tại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: CONFLICT
                  message: Username or email already exists
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập và cấp token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Sai username, email, hoặc password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Invalid login or password
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Kiểm tra token và trả user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /groups:
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Tạo nhóm, người tạo là owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Đã tạo nhóm và ghi người tạo là owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      tags: [Groups]
      operationId: listGroups
      summary: Xem danh sách nhóm của user hiện tại
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Các nhóm user đang là thành viên, kể cả nhóm user làm owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /groups/{groupId}/members:
    post:
      tags: [Groups]
      operationId: addGroupMember
      summary: Owner thêm thành viên
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Đã thêm thành viên với role MEMBER.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User đã là thành viên.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: CONFLICT
                  message: User is already a member
  /groups/{groupId}/members/{userId}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Owner xoá thành viên, hoặc thành viên tự rời
      description: |
        Owner xoá user khác. Thành viên tự rời khi userId là chính mình.
        Owner không tự rời và không bị xoá.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/MemberUserId"
      responses:
        "204":
          description: Đã xoá membership.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{conversationId}/messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Gửi một tin TEXT hoặc EMOTION
      description: |
        Ghi tin trước khi phát event `messaging.message.created`.
        Cùng sender và cùng clientMsgId trả lại tin cũ, không tăng seq.
        Bản v1 chưa có API tạo hội thoại. conversationId là UUID do client sinh.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Tin mới đã ghi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "200":
          description: clientMsgId đã tồn tại. Trả tin đã ghi, seq không đổi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /ws:
    get:
      tags: [Messages]
      operationId: connectRealtime
      summary: Mở WebSocket nhận tin mới
      description: |
        Nâng cấp lên WebSocket. Session id truyền query `access_token` vì trình duyệt không gắn header Authorization cho WebSocket.
        Thiếu session, session không tồn tại, hoặc session hết hạn thì đóng kết nối, không nâng cấp.
        Mỗi frame là envelope trong doc/contract/events.md. Bản v1 chỉ đẩy `messaging.message.created`.
      parameters:
        - name: access_token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: Đã nâng cấp sang WebSocket.
        "401":
          $ref: "#/components/responses/Unauthenticated"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Session id do Identity cấp trong accessToken. Không phải JWT.
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: Thiếu session, session không tồn tại, hoặc session hết hạn.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Missing or invalid access token
    ValidationError:
      description: Body không đúng hợp đồng.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Text body exceeds 4096 bytes
    Forbidden:
      description: User không có quyền với nhóm này.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
              message: Not allowed to change this group
    NotFound:
      description: Nhóm hoặc user không tồn tại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Group not found
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]+$"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          description: Username hoặc email.
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Session id opaque do Identity cấp. Client gửi lại nguyên chuỗi. Không phải JWT.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Số giây đến khi access token hết hạn. Bản này là 3 ngày.
          example: 259200
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required: [userId, username, email]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    Group:
      type: object
      additionalProperties: false
      required: [groupId, name, ownerId, role]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
        ownerId:
          type: string
          format: uuid
        role:
          type: string
          description: Role của user hiện tại trong nhóm.
          enum: [OWNER, MEMBER]
    GroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    Membership:
      type: object
      additionalProperties: false
      required: [groupId, userId, role]
      properties:
        groupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [MEMBER]
    SendMessageRequest:
      oneOf:
        - $ref: "#/components/schemas/SendTextRequest"
        - $ref: "#/components/schemas/SendEmotionRequest"
      discriminator:
        propertyName: type
        mapping:
          TEXT: "#/components/schemas/SendTextRequest"
          EMOTION: "#/components/schemas/SendEmotionRequest"
    SendTextRequest:
      type: object
      additionalProperties: false
      required: [type, body, clientMsgId]
      properties:
        type:
          type: string
          enum: [TEXT]
        body:
          type: string
          minLength: 1
          description: Server từ chối khi UTF-8 dài hơn 4096 byte.
        clientMsgId:
          type: string
          format: uuid
    SendEmotionRequest:
      type: object
      additionalProperties: false
      required: [type, body, clientMsgId]
      properties:
        type:
          type: string
          enum: [EMOTION]
        body:
          type: string
          description: Mã icon trong bộ đã chốt.
          enum: [like, love, haha, wow, sad, angry]
        clientMsgId:
          type: string
          format: uuid
    Message:
      oneOf:
        - $ref: "#/components/schemas/TextMessage"
        - $ref: "#/components/schemas/EmotionMessage"
      discriminator:
        propertyName: type
        mapping:
          TEXT: "#/components/schemas/TextMessage"
          EMOTION: "#/components/schemas/EmotionMessage"
    TextMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [type, body]
          properties:
            type:
              type: string
              enum: [TEXT]
            body:
              type: string
    EmotionMessage:
      allOf:
        - $ref: "#/components/schemas/MessageBase"
        - type: object
          required: [type, body]
          properties:
            type:
              type: string
              enum: [EMOTION]
            body:
              type: string
              enum: [like, love, haha, wow, sad, angry]
    MessageBase:
      type: object
      required: [messageId, conversationId, seq, senderId, clientMsgId, createdAt]
      properties:
        messageId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        senderId:
          type: string
          format: uuid
        clientMsgId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT]
            message:
              type: string
