# Local demo: one Postgres + one app process (identity+messaging+analytics).
#   cd infra && cp .env.local.example .env && ./scripts/local-up.sh
name: halozalo-local

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # Standalone split services off for local monolith demo.
  identity:
    profiles: ["split"]

  messaging:
    profiles: ["split"]

  app:
    build:
      context: ${APP_CONTEXT:-../services}
      dockerfile: app/Dockerfile
    image: halozalo/app:local
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-halozalo}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-halozalo}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-halozalo}
      IDENTITY_PUBLIC_BASE_URL: http://localhost:8080
      IDENTITY_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*,http://192.168.*:*
      IDENTITY_MAIL_MODE: log
      MESSAGING_USER_HEADER_ENABLED: "false"
      # Signs media download links. Unset: random per start, so links in open tabs break on restart.
      MESSAGING_MEDIA_SIGNING_KEY: ${MESSAGING_MEDIA_SIGNING_KEY:-}
      MESSAGING_MEDIA_STORAGE_DIR: /var/halozalo/media
      MESSAGING_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,http://192.168.*:*
    volumes:
      - app_media:/var/halozalo/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.[01] 200' <&3"]
      interval: 10s
      timeout: 4s
      start_period: 60s
      retries: 8
    restart: unless-stopped
    networks: [backend]

  edge:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    ports:
      - "8088:80"
    volumes:
      - ./nginx/local/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]

  nginx:
    profiles: ["cloud"]

  certbot:
    profiles: ["tools"]

volumes:
  app_media:
