services:
  postgres:
    image: postgres:16
    container_name: halozalo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: halozalo
      POSTGRES_PASSWORD: halozalo
      POSTGRES_DB: halozalo
      TZ: UTC
    volumes:
      - halozalo-postgres:/var/lib/postgresql/data
      - ./postgres/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ../services/identity/resources/schema.sql:/docker-entrypoint-initdb.d/02-identity.sql:ro
      - ./postgres/03-dummy.sql:/docker-entrypoint-initdb.d/03-dummy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halozalo -d halozalo"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  halozalo-postgres:
