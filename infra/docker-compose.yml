name: halozalo

services:
  # Local/dev only. Cloud uses Amazon RDS via DB_HOST (see deploy-ec2.sh).
  postgres:
    profiles: ["local-db"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-halozalo}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in infra/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ../services/identity/resources/schema.sql:/docker-entrypoint-initdb.d/02-identity.sql:ro
      - ./postgres/03-dummy.sql:/docker-entrypoint-initdb.d/03-dummy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  app:
    build:
      context: ${APP_CONTEXT:-../services}
      dockerfile: app/Dockerfile
    image: halozalo/app:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:5432/${DB_NAME:-halozalo}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      IDENTITY_PUBLIC_BASE_URL: https://${DOMAIN}
      IDENTITY_CORS_ALLOWED_ORIGIN_PATTERNS: https://${DOMAIN},http://${DOMAIN}
      IDENTITY_REGISTRATION_ACTIVATION: ${IDENTITY_REGISTRATION_ACTIVATION:-email}
      IDENTITY_PLATFORM_ADMINS: ${IDENTITY_PLATFORM_ADMINS:-}
      IDENTITY_MAIL_MODE: ${IDENTITY_MAIL_MODE:-log}
      IDENTITY_MAIL_FROM: ${IDENTITY_MAIL_FROM:-noreply@halozalo.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MESSAGING_USER_HEADER_ENABLED: "false"
      MESSAGING_MEDIA_BACKEND: ${MESSAGING_MEDIA_BACKEND:-s3}
      MESSAGING_MEDIA_PUBLIC_BASE_URL: https://${DOMAIN}/api/messaging
      MESSAGING_MEDIA_S3_BUCKET: ${MESSAGING_MEDIA_S3_BUCKET:-}
      MESSAGING_MEDIA_S3_REGION: ${MESSAGING_MEDIA_S3_REGION:-ap-southeast-1}
      MESSAGING_MEDIA_S3_KEY_PREFIX: ${MESSAGING_MEDIA_S3_KEY_PREFIX:-media/}
      MESSAGING_CORS_ALLOWED_ORIGINS: https://${DOMAIN},http://localhost:5173,http://localhost:8081
      AWS_REGION: ${MESSAGING_MEDIA_S3_REGION:-ap-southeast-1}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.[01] 200' <&3"]
      interval: 10s
      timeout: 4s
      start_period: 90s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_IDENTITY_BASE_URL: ${VITE_API_IDENTITY_BASE_URL:-https://${DOMAIN}/api/identity}
        VITE_API_MESSAGE_BASE_URL: ${VITE_API_MESSAGE_BASE_URL:-https://${DOMAIN}/api/messaging}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-wss://${DOMAIN}/api/messaging}
    image: halozalo/edge:local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/current:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
