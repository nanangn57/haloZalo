# Optional edge: both prefixes → one app process :8080
server {
    listen 80;
    server_name localhost;
    client_max_body_size 26m;

    location = /api/identity {
        return 301 /api/identity/;
    }

    location ^~ /api/identity/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/messaging {
        return 301 /api/messaging/;
    }

    location ^~ /api/messaging/ws {
        # Keep ?access_token=… (needed for SessionFilter on /ws).
        proxy_pass http://app:8080/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/messaging/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type text/plain;
        return 200 'haloZalo monolith edge\napp: /api/identity/ and /api/messaging/ → :8080\n';
    }
}
