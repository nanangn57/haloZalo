server:
  port: 8080

identity:
  public-base-url: ${IDENTITY_PUBLIC_BASE_URL:http://localhost:8080}
  # Comma-separated usernames promoted to platform ADMIN on startup / account create.
  platform-admins: ${IDENTITY_PLATFORM_ADMINS:}
  registration:
    # email — send verification link (default). immediate — create account in register (ops only).
    activation: ${IDENTITY_REGISTRATION_ACTIVATION:email}
  mail:
    # log (local) | smtp (Gmail/SMTP qua spring.mail — bí mật ở .env / env, không commit).
    mode: ${IDENTITY_MAIL_MODE:log}
    from: ${IDENTITY_MAIL_FROM:noreply@halozalo.local}
  cors:
    # Web (Vite) gọi từ origin khác cổng 8080. Thêm pattern nếu mở web bằng IP máy, ví dụ http://192.168.1.10:*.
    allowed-origin-patterns: ${IDENTITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

spring:
  config:
    # Local secrets, never committed. Real environment variables win over this file. See .env.example.
    import: optional:file:./.env.local[.properties]
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
    # Defaults match infra shared Postgres (localhost). Docker compose overrides host to postgres.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/halozalo}
    username: ${SPRING_DATASOURCE_USERNAME:halozalo}
    password: ${SPRING_DATASOURCE_PASSWORD:halozalo}
    hikari:
      connection-init-sql: SET search_path TO identity
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:analytics-schema.sql
