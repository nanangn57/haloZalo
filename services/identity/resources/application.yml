server:
  port: 8080

identity:
  public-base-url: http://localhost:8080
  cors:
    # Web (Vite) gọi từ origin khác cổng 8080. Thêm pattern nếu mở web bằng IP máy, ví dụ http://192.168.1.10:*.
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/halozalo
    username: halozalo
    password: halozalo
    hikari:
      connection-init-sql: SET search_path TO identity
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
