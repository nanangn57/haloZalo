# Messaging with its own PostgreSQL, for local development. Set up like infra/docker-compose.yml:
# database halozalo, user halozalo; messaging uses schema messaging, created by Flyway on start.
#   docker compose up --build        start everything on http://localhost:8082 and ws://localhost:8082/ws
#   docker compose down              stop; Postgres data stays in the postgres-data volume
#   docker compose down -v           stop and delete the data
# Uses port 5432 like infra/docker-compose.yml and ./local-deps.sh: run one of them at a time.
# Requests need the X-User-Id header until the app's session filter exists.

name: halozalo-messaging

services:
  messaging:
    build:
      context: ..
      dockerfile: messaging/Dockerfile
    image: halozalo/messaging:local
    ports:
      - "8082:8082"
    environment:
      # Inside the compose network the database is reached by service name, not localhost.
      # Set these in your shell to point at a cloud PostgreSQL instead.
      POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/halozalo}
      POSTGRES_USER: ${POSTGRES_USER:-halozalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-halozalo}
      MESSAGING_USER_HEADER_ENABLED: ${MESSAGING_USER_HEADER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl, so ask /actuator/health with bash. UP means the app and Postgres are fine.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    # Matches server.shutdown: graceful, so sockets close with 1001 before the container stops.
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: halozalo
      POSTGRES_USER: ${POSTGRES_USER:-halozalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-halozalo}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d halozalo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
