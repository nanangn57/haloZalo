server:
  port: 8082
  # Finish in-flight HTTP writes before stopping; open sockets are closed with 1001 so clients reconnect elsewhere.
  shutdown: graceful

spring:
  config:
    # Local secrets, never committed. Real environment variables win over this file. See .env.example.
    import: optional:file:./.env.local[.properties]
  datasource:
    # The shared halozalo database. Defaults match infra/docker-compose.yml.
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/halozalo}
    username: ${POSTGRES_USER:halozalo}
    password: ${POSTGRES_PASSWORD:halozalo}
    hikari:
      # Unqualified table names mean schema messaging. Other schemas are never read.
      connection-init-sql: SET search_path TO messaging
      # Fail fast instead of queueing requests for half a minute when Postgres is down.
      connection-timeout: 5000
  flyway:
    # Creates schema messaging if missing, and upgrades it from resources/db/migration on start.
    schemas: messaging
    default-schema: messaging
    locations: classpath:db/migration

messaging:
  # Accept X-User-Id while messaging runs on its own. Must be false in the app, where the session filter sets the
  # user; otherwise any client could claim to be any user. See http.CurrentUser.
  user-header-enabled: ${MESSAGING_USER_HEADER_ENABLED:true}
  realtime:
    allowed-origins: "*"
    ping-interval: 25s
    pong-timeout: 60s
    send-time-limit: 10s
    send-buffer-limit: 512KB
    max-text-message-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: health
